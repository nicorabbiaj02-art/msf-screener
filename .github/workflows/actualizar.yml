name: Actualizar datos y publicar

on:
  schedule:
    # Lunes a viernes 22:30 UTC (19:30 en Argentina), después del cierre de Wall Street
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: screener-msf
  cancel-in-progress: false

jobs:
  publicar:
    # Los datos (unos 50 MB con el año de velas de cada acción) se generan en cada corrida
    # y se publican directo en GitHub Pages, sin guardarse en el repo.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar precios y calcular RSI / MACD / divergencias
        run: python scripts/actualizar_datos.py
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
